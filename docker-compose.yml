services:
  postgres:
    image: postgres:16
    container_name: lawfirm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lawfirm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawfirm}
      POSTGRES_DB: ${POSTGRES_DB:-lawfirm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lawfirm} -d ${POSTGRES_DB:-lawfirm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local stand-in for Cloudflare R2; the API talks S3 to both (R2_ENDPOINT=http://localhost:9000).
  minio:
    image: minio/minio:latest
    container_name: lawfirm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates the documents bucket after MinIO is healthy.
  minio-init:
    image: minio/mc:latest
    container_name: lawfirm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${R2_ACCESS_KEY_ID:-minioadmin} ${R2_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${R2_BUCKET:-law-firm-documents} &&
      echo 'bucket ready'
      "

volumes:
  postgres_data:
  minio_data:
