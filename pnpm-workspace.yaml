packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks lifecycle scripts by default; allow the native/binary packages we rely on.
onlyBuiltDependencies:
  - argon2
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - sharp
  - unrs-resolver
  - "@tailwindcss/oxide"
  - "@nestjs/core"
